name: build & test StaffCloud

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Build StaffCloud with coverage
        run: |
          gcc -Wall -Wextra -std=c11 --coverage -o staffcloud *.c

      - name: Run test suite
        run: |
          chmod +x test.sh
          ./test.sh tee test_results.txt

     
      - name: Generate gcov coverage reports
        run: gcov *.c

    
      - name: Upload artifacts (binary + coverage)
        uses: actions/upload-artifact@v4
        with:
